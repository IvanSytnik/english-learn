name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: 1
  SKIP_ENV_VALIDATION: "1"

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: englishlearn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/englishlearn_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/englishlearn_test
      # Migrated before `pnpm test`: the diagnostic DB tests run against it.
      DIAG_DB_TEST_URL: postgresql://postgres:postgres@localhost:5432/englishlearn_test
      AUTH_SECRET: ci-secret-do-not-use-in-prod-32chars

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations to test DB
        run: pnpm --filter @englishlearn/db migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: englishlearn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/englishlearn_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/englishlearn_test
      AUTH_SECRET: ci-secret-do-not-use-in-prod-32chars
      CI: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @englishlearn/db migrate:deploy
      - run: pnpm --filter @englishlearn/db seed
      # Concepts + items (with practice questions) for the exercise player e2e.
      - run: pnpm --filter @englishlearn/learner-model seed:concepts
      - run: pnpm --filter @englishlearn/learner-model seed:items
      - run: pnpm --filter @englishlearn/learner-model seed:diagnostic

      - name: Install Playwright browsers
        run: pnpm --filter @englishlearn/web exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
